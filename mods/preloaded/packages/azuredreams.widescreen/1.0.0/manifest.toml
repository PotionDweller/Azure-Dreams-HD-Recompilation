format_version = 6
id = "azuredreams.widescreen"
version = "1.0.0"
name = "Widescreen 16:9"
author = "AzureDreamsRecomp"
description = "Renders a wider 16:9 view of the world at its original proportions (no stretching). Presentation only: saves are unaffected and turning it off restores the original 4:3 picture exactly."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00614"

[[feature]]
id = "widescreen"
name = "Widescreen 16:9"
description = "Experimental and off by default. Objects near the left/right edges may pop in, and some HUD or menu elements may not be placed for the wider screen. FMVs and the BIOS boot stay 4:3."
group = "Visual"
channel = "experimental"
default_enabled = false

[[plugin]]
feature = "widescreen"
id = "azuredreams.widescreen"
