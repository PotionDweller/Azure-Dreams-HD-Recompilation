format_version = 6
id = "azuredreams.widescreen"
version = "1.0.0"
name = "Widescreen 16:9"
author = "AzureDreamsRecomp"
description = "Renders a wider 16:9 view of the world at its original proportions (no stretching). Presentation only: saves are unaffected and turning it off restores the original 4:3 picture exactly."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00614"

[[feature]]
id = "widescreen"
name = "Widescreen 16:9"
description = "On by default. Widens the town and dungeon view to 16:9 and moves the HUD panel and dungeon minimap to the wide screen edges. Movies, menus and the BIOS boot stay 4:3. Turn off for the original 4:3 picture."
group = "Visual"
default_enabled = true

[[plugin]]
feature = "widescreen"
id = "azuredreams.widescreen"
