[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "Azure Dreams Recompiled"
memcard_dir = "saves"
# Record each overlay the game runs (bytes + executed PCs) so
# tools/compile_overlays.py can turn them into native code. Capture path is
# set in .psxrecomp.env (captures/, gitignored -- contains game code).
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
# HD: render at 4x native (max), plus PGXP-style corrections. Both corrections
# are visual-only and fall back to the faithful path on anything unproven.
supersampling = 4
geometry_correction = true     # sub-pixel vertices: no polygon wobble
perspective_texturing = true   # perspective-correct UVs: no texture warping
# Upscale filter for 24-bit screens (FMVs and the title art):
# "nearest" (default, blocky) | "bilinear" (softest) | "sharp" | "bicubic"
fmv_filter = "bicubic"

[controller]
default_mode = "digital"
# First connected SDL gamepad drives player 1 (release builds default to
# keyboard otherwise).
p1_device = "auto"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "f6cb0129b404c086abbb1be8bc7792bb8c43f5bdbf12bcaef0e04df3ac660013"
