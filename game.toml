# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "Azure Dreams"
id = "SLUS-00614"
players = 1
exe = "disc/SLUS_006.14"
disc = "F:\\GameCompilations\\Games\\Azure Dreams\\Azure Dreams (USA)\\Azure Dreams (USA).cue"
load_address = "0x8002D000"
entry_pc = "0x80033930"
text_size = "0x00054800"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Azure Dreams (USA).bin"
cue_name = "Azure Dreams (USA).cue"
boot_exe = "SLUS_006.14"
known_sizes = [298576992]
known_md5 = [
  "9f0afe31a2993af90e43a5ff3139e331",
]
known_sha1 = [
  "fab68454be5e4e48f7a43ac797cc8c47325c6a20",
]
known_crc32 = [
  "7b0c5f60",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Trusted mod hooks (src/mod_widescreen.c): dungeon minimap draw function, so
# the widescreen mod can read its state pointer from $a1. No-op unless the
# widescreen mod is enabled.
mod_function_entry_funcs = ["0x8009E798"]

[runtime]
window_title = "Azure Dreams Recompiled"
memcard_dir = "saves"
# Record each overlay the game runs (bytes + executed PCs) so
# tools/compile_overlays.py can turn them into native code. Capture path is
# set in .psxrecomp.env (captures/, gitignored -- contains game code).
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
# HD: render at 4x native (max), plus PGXP-style corrections. Both corrections
# are visual-only and fall back to the faithful path on anything unproven.
supersampling = 4
geometry_correction = true     # sub-pixel vertices: no polygon wobble
perspective_texturing = true   # perspective-correct UVs: no texture warping
# Upscale filter for 24-bit screens (FMVs and the title art):
# "nearest" (default, blocky) | "bilinear" (softest) | "sharp" | "bicubic"
fmv_filter = "bicubic"

# Widescreen presentation (only when the widescreen mod is enabled).
# gte_game_mode: frames that project 3D geometry are gameplay and render
# native-wide; full-2D screens (menus, save) and FMVs stay 4:3 pillarboxed.
[widescreen]
gte_game_mode = true

# Widescreen culling. Inert at 4:3: every widened compare uses a margin that
# is zero unless the (experimental, default-off) widescreen mod is enabled.
[widescreen.cull]
auto_screen_x = true   # widen the standard GTE screen-extent rejects
# Azure Dreams' reject window is the biased `x+32 < 385` / `y+32 < 289`
# (320x224 plus a 32 px margin), not the default 320/240 family. Seen in
# func_80033D54, 800345B8, 80037714, 800453E0, 80045CC4 and overlay copies.
# 0x1D6 (470) is NOT a width here: in func_800453E0 it bounds an object
# countdown at obj+192, so it must stay out.
screen_w_imms = ["0x181"]
screen_h_imms = ["0x121"]
# 2D sprite on-screen test (characters/monsters): biased X window
# `sltiu x+32, 385` (= 320 + 2*32 + 1), four corners, two copies of the
# function. The paired `sltiu y+32, 289` compares are VERTICAL and are
# deliberately left out. Found with `psxrecomp-analyze --scan-widescreen`.
screen_x_sites = [
  # func_80037714 (main EXE)
  "0x800377F0", "0x80037820", "0x80037854", "0x80037888",
  "0x80037A90", "0x80037AC0", "0x80037AF4", "0x80037B28",
  # func_800AFFB4 (overlay)
  "0x800B00BC", "0x800B00EC", "0x800B0120", "0x800B0154",
]

[controller]
default_mode = "digital"
# First connected SDL gamepad drives player 1 (release builds default to
# keyboard otherwise).
p1_device = "auto"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "f6cb0129b404c086abbb1be8bc7792bb8c43f5bdbf12bcaef0e04df3ac660013"
